 UBD_crush_separatism_in_osel_and_dago_decision: "Восстановление порядка на Эзеле и Даго"
 UBD_crush_separatism_in_osel_and_dago_decision_desc: "Эзель и Даго - крупнейшие острова Эстляндии, являющиеся вотчиной Эзельского рыцарства. Проживающее там немецкое население подвергается постоянным атакам эстонских националистов. Представители Ордена требуют немедленно положить этому конец."
 UBD_crush_separatism_in_livonia_decision: "Восстановление порядка в Ливонии"
 UBD_crush_separatism_in_livonia_decision_desc: "Ливония - центральная часть страны почти полностью покрытая лесами. Из-за этого она стала буквально центром сопротивления латышских партизан."
 
