 UBD_crush_separatism_decisions_category: "Борьба с сепаратизмом"
 UBD_crush_separatism_decisions_category_desc: "Политика проводимая правительством в аграрной сфере спровоцировала вспышку недовольства в латышской и эстонской крестьянской среде. Беспорядки охватили всю страну и если ничего не предпринять националисты и большевики вновь поднимут головы и наверняка попытаются свергнуть правительство."
