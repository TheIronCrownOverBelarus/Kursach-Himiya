l_russian:
 UBD_Stepan_Petrichenko: "Степан Петриченко"
 UBD_Stepan_Petrichenko_DESC: "Степан Максимович Петриченко, 1892 года рождения. Из семьи малоземельных крестьян, старший писарь линкора «Петропавловск». В декабре 1917 года возглавил Советскую республику матросов и строителей на острове Нарген."
 UBD_Fritsis_Rozin: "Фрицис Розинс"
 UBD_Fritsis_Rozin_DESC: "Фрицис Розинс, 1870 года рождения. Латышский марксист и революционер, издатель социал-демократической литературы и колумнист, председатель Исколата."
 UBD_Augusts_Deglavs: "Августс Деглавс"
 UBD_Augusts_Deglavs_DESC: "Августс Деглавс, 1862 года рождения. Латышский писатель, работник типографии, издатель и торговец. После Февральской революции активно участвовал в политике, принимал участие в создании Латвийской демократической партии. Один из главных организаторов Демократического блока в Риге."
 UBD_Eduard_fon_Rozenberg: "Эдуард фон Розенберг"
 UBD_Eduard_fon_Rozenberg_DESC: "Эдуард Виктор фон Розенберг, 1878 года рождения. Остзейский юрист и политик. Один из главных организаторов Немецко-балтийской прогрессивной партии."
 UBD_Paul_Schiemann: "Пауль Шиман"
 UBD_Paul_Schiemann_DESC: "Пауль Шиман, 1876 года рождения. Остзейский политик, театральный критик и обозреватель, редактор газеты "Rigasche Rundschau". Лидер возрожденной Немецко-балтийской демократической партии."
 UBD_Adolf_Pilar_von_Pilchau: "Адольф Пилар фон Пильхау"
 UBD_Adolf_Pilar_von_Pilchau_DESC: "Адольф Константин Якоб Пилар фон Пильхау-Аудерн, 1851 года рождения. Остзейский дворянин, политик, ландмаршал Лифляндского рыцарства, представитель балтийских губерний в Государственном совете Российской империи."
 UBD_Eduard_Delinsgauzen: "Эдуард фон Деллингсгаузен"
 UBD_Eduard_Delinsgauzen_DESC: "Эдуард Юлиус Александр Фрейхерр фон Деллингсгаузен, 1863 года рождения. Остзейский дворянин, политик, ландмаршал Эстляндского рыцарства."
 UBD_Vilhelm_Reimers: "Вильгельм Реймерс"
 UBD_Vilhelm_Reimers_DESC: "Вильгельм Генрих Мартин Реймерс, 1857 года рождения. Остзейский общественный деятель, старейшина Рижской большой гильдии, президент Рижского немецкого театрального общества, глава Видземского попечительского совета."
 UBD_Alexander_von_Rahden: "Александр фон Раден"
 UBD_Alexander_von_Rahden_DESC: "Александр Эммануил фон Раден, 1859 года рождения. Остзейский дворянин, политик, специалист по генеалогии. После начала Мировой войны был выслан в Сибирь. По возвращении стал депутатом и председателем Курляндского Ландрата."
 UBD_Alfred_Fletcher: "Альфред Флетчер"
 UBD_Alfred_Fletcher_DESC: "Альфред Флетчер, 1875 года рождения. Офицер Германского Рейхсхеера. Возглавил формирующиеся подразделения Ландесвера благодаря своим связям с представителями остзейской общины."
 UBD_Alfred_von_Gossler: "Альфред фон Госслер"
 UBD_Alfred_von_Gossler_DESC: "Альфред фон Госслер, 1867 года рождения. Юрист, депутат Рейхстага. Во время Мировой войны воевал на Западном и Восточном фронтах, позднее возглавил немецкую администрацию в Курляндии."
 UBD_Hans_von_Manteuffel_Szoege: "Ганс Цеге фон Мантойфель"
 UBD_Josef_Bischoff: "Йозеф Бишоф"
 UBD_Adolf_Friedreich_Mecklenburg: "Адольф Фридрих Мекленбург-Шверинский"
 UBD_Adolf_Friedreich_Mecklenburg_DESC: "Адольф Фридрих Альбрехт Генрих - герцог Мекленбург-Шверинский, сын великого герцога Мекленбург-Шверинского Фридриха Франца II. Прославился своими исследованиями Африки, последний губернатор немецкой колонии Того. Был избран монархом Объединенного балтийского герцогства на заседании Объединенного Ландрата Лифляндии, Эстляндии, Эзеля и Риги."
 UBD_Vladimir_Bukovsky: "Владимир Буковский"
 UBD_Vladimir_Bukovsky_DESC: "Владимир Иосифович Буковский, 1867 года рождения. Из семьи польских дворян, член Рижского окружного суда, преподаватель основ права в Рижской Александровской гимназии."
 UBD_William_von_Engelhart: "Вильгельм фон Энгельгардт"
 UBD_William_von_Engelhart_DESC: "Вильгельм фон Энгельгардт, 1862 года рождения. Из дворян Лифляндской губернии, полковник Русской Императорской Армии в отставке. В 1918 году присоединился к частям Балтийского Ландесвера, возглавив разведывательный кавалерийский отряд."
 