 UBD_eiserne_division_tt: "§YБудет сформирована §GЖелезная дивизия§! из немецких добровольцев§!."
 UBD_six_reserve_corps_tt: "§YПравительство получит в распоряжение §G1-ую гвардейскую резервную дивизию§! Германского Рейхсхеера в составе §Gдвух пехотных§! и §Gодной артиллерийской§! бригады§!."
 UBD_start_ostpolitik_tt: "Будут открыты §Yрешения§! на проведение §RОст-политики§!."
 UBD_land_measurements_decision_tt: "Проведение землемерных работ позволит нам оценить весь имеющийся в распоряжении рыцарских орденов земельный фонд."
 UBD_take_land_decision_tt: "Правительство проведет ряд заседаний с целью определить какие земли будут изъяты из собственности Орденов и создаст из них специальный фонд для передачи земли немецким поселенцам."
 UBD_loyalist_lands_decision_tt: "Для упрочнения нашего положения в среде латышского и эстонского крестьянства правительство считает необходимым вознаградить наиболее лояльных представителей балтийских народов небольшими земельными наделами."
