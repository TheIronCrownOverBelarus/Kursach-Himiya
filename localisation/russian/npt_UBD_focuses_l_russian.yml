l_russian:
 UBD_create_government_system: "Создание системы управления"
 UBD_create_government_system_desc: "Создание нового государства почти с нуля требует от администрации значительных усилий. Необходимо объединить все существующие органы местного самоуправления и организовать единую иерархию власти."
 UBD_gather_landesrat: "Созыв Балтийского Ландрата"
 UBD_gather_landesrat_desc: "Для принятия решения о будущем балтийских губерний администрация намерена созвать Объединенный ландрат Лифляндии, Эстляндии, Эзеля и Риги. На него будут приглашены представители рыцарства, крупнейших городов, а также всех существующих ландратов."
 UBD_regentschaftsrat: "Регентский совет"
 UBD_regentschaftsrat_desc: "Рейхсканцлер Германии считает необходимым ликвидацию военной администрации. Власть в герцогстве будет передана местным общественным деятелям из которых будет образован новый высший орган власти - Регентский совет"
 UBD_constitution: "Обсуждение конституции"
 UBD_constitution_desc: "Объединенный ландрат уже продолжительное время обсуждает проект конституции герцогства, однако процесс затягивается из-за постоянных споров по наиболее важным вопросам. Регентский совет намерен вмешаться и помочь ландрату завершить основной закон."
 UBD_education_reform: "Реформа образования"
 UBD_education_reform_desc: "Сепаратисты уже давно занимаются враждебной агитацией среди низших слоев населения. Правительство намерено принять участие в этой битве за умы и, пользуясь имеющимися ресурсами, провести образовательную реформу в герцогстве."
 UBD_knighthood_support: "Поддержка Балтийского Рыцарства"
 UBD_knighthood_support_desc: "Регентский совет в массе своей состоит из представителей остзейского рыцарства. Будет разумно заручиться полной политической поддержкой этих организаций."
 UBD_economic_regulation: "Расширение экономического вмешательства"
 UBD_economic_regulation_desc: "Повсеместная политическая и экономическая нестабильность вынуждает правительство принять ряд мер по увеличению государственного вмешательства в экономику страны."
 UBD_trade_law: "Новое таможеное законодательство"
 UBD_trade_law_desc: "Распад России оборвал традиционные экономические связи, а устаревшие имперские законы мешают экономическому росту. Необходимо полностью переписать торговое и таможенное законодательство опираясь на опыт Германской Империи."
 UBD_german_economic_integration: "Экономическая интеграция с Германией"
 UBD_german_economic_integration_desc: "Будущее остзейских немцев неразрывно связано с Германией и правительство герцогства намерено продолжить курс на упрочнение этих связей путем дальнейшей экономической интеграции."
 UBD_wellfare: "Социальное законодательство"
 UBD_wellfare_desc: "Несмотря на преобладание в правительстве консервативных правых взглядов на рабочий вопрос, оно все же вынуждено идти на уступки, чтобы заручится поддержкой рабочих и вырвать их из лап социалистов."
 UBD_police_organisation: "Организация полиции и контрразведки"
 UBD_police_organisation_desc: "Для выживания герцогства необходимо заменить местные отряды ополчения при ландратах на профессиональную полицию, способную противостоять сепаратистам и большевистскому подполью."
 UBD_form_landwehr: "Формирование Ландвера"
 UBD_form_landwehr_desc: "Регентский совет подготовил план по созданию лояльной вооруженной силы - Балтийского Ландвера. Уже существующие местные отряды  самообороны состоящие из остзейских немцев будут объединены в единую регулярную армейскую структуру при активном содействии германских советников."
 UBD_open_arsenals: "Рижский арсенал"
 UBD_open_arsenals_desc: "Военная промышленность страны серьезно пострадала от войны, многие заводы были разрушены, заброшены или вовсе эвакуированы в Россию. Для обеспечения ландвера боеприпасами и снижения зависимости от Германии в военной сфере правительство намерено выделить средства на восстановление арсенала в Риге."
 UBD_form_ethnic_batalions: "Формирование национальных полков"
 UBD_form_ethnic_batalions_desc: "Имеющегося остзейского немецкого населения слишком мало чтобы обеспечить растущие вооруженные силы пополнениями. Необходимо начать рекрутский набор среди наиболее лояльных слоев эстонского и латышского населения для формирования лояльных национальных частей."
 UBD_form_rus_batalions: "Русские добровольческие части"
 UBD_form_rus_batalions_desc: "На территории герцогства остается множество бывших солдат и офицеров императорской армии настроенных против большевиков. Военное рукводство Рейха уже начало использовать этот ресурс для формирования прогерманских антибольшевистских частей. Правительство намерено создать аналогичные отряды подчиненные командованию ландвера."
 UBD_mobilise_officers: "Мобилизация офицеров"
 UBD_mobilise_officers_desc: "В частях наблюдается острая нехватка кадров среди офицерского состава. Необходимо поставить в строй каждого офицера годного к службе в армии."
 UBD_ost_ruble: "Введение Ост рубля"
 UBD_ost_ruble_desc: "Отсутсвие собственной валюты и финансовых резервов вынуждает Совет обратиться к администрации Обер-оста с целью согласования заема на нужды правительства."
 UBD_landowners_finance: "Пожертвования землевладельцев"
 UBD_landowners_finance_desc: "Регентский совет намерен получить справедливую оплату в виде принудительного займа за свои труды на поприще защиты прав и свобод остзейских помещиков."
 UBD_start_ostpolitik: "Ост-политика"
 UBD_start_ostpolitik_desc: "Власти Германии намерены провести мероприятия по германизации прибалтийских губерний путем колонизации края немцами из Рейха и немецкими беженцами из Поволжья, Крыма и Украины. Правительство герцогства так же заинтересовано в этих мероприятиях, ведь рост числа лояльного немецкого населения упрочнит власть остзейских немцев над латышами и эстонцами."
 UBD_offer_the_land: "Добровольцы из Рейхсхеера"
 UBD_offer_the_land_desc: "Германское командование предложило план по которому военнослужащие 8-ой армии немецкого Рейхсхеера, находящейся в Герцогстве, получат земельный надел и гражданство в обмен на службу в вооруженных формированиях подчиненных правительству Герцогства. Майор Йозеф Бишов уже ведет работу по созданию таких формирований."
 UBD_six_reserve_corps: "Запрос немецких войск"
 UBD_six_reserve_corps_desc: "Для борьбы с большевистской угрозой правительство намерено обратиться к властям Германии вмешаться в конфликт и передать в подчинение Герцогству 6-ой резервный корпус генерала Гольца находящийся в Пруссии."
 UBD_ostzee_army: "Остзейская армия"
 UBD_ostzee_army_desc: "Пришло время объеденить разрозненные части Ландвера в единую Остзейскую Армию"
 UBD_crush_separatist_organisations: "Герцогство на века"
 UBD_crush_separatist_organisations_desc: ""
 
