l_russian:
 UBD_create_government_system: "Создание системы управления"
 UBD_create_government_system_desc: "Создание нового государства почти с нуля требует от администрации значительных усилий. Необходимо объединить все существующие органы местного самоуправления и организовать единую иерархию власти."
 UBD_gather_landesrat: "Созыв Балтийского Ландрата"
 UBD_gather_landesrat_desc: "Для принятия решения о будущем балтийских губерний немецкая администрация намерена созвать Объединенный ландрат Лифляндии, Эстляндии, Эзеля и Риги. На него будут приглашены представители рыцарства, крупнейших городов, а также всех существующих ландратов."
 UBD_regentschaftsrat: "Регентский совет"
 UBD_regentschaftsrat_desc: "Рейхсканцлер Германии заявил о необходимости ликвидации оккупационных администраций на Востоке и замены их местным гражданским управлением. Власть в Герцогстве будет передана местным общественным деятелям из которых будет образован новый временный орган власти - Регентский совет Герцогства Балтийского."
 UBD_constitution: "Обсуждение конституции"
 UBD_constitution_desc: "Объединенный ландрат уже продолжительное время обсуждает проект конституции герцогства, однако процесс затягивается из-за постоянных споров по наиболее важным вопросам. Регентский совет намерен вмешаться и помочь ландрату завершить основной закон."
 UBD_knighthood_support: "Поддержка Балтийского Рыцарства"
 UBD_knighthood_support_desc: "Регентский совет в массе своей состоит из представителей остзейского рыцарства. Рыцарство должно стать рядом с Советом в этот трудный для страны час и помочь регентам нести тяжелое бремя власти."
 UBD_education_reform: "Реформа образования"
 UBD_education_reform_desc: "Сепаратисты уже давно занимаются враждебной в отношении Балтенланда агитацией среди беднейших и наименее образованных слоев населения. Правительство намерено принять участие в этой битве за умы и, пользуясь имеющимися ресурсами, провести образовательную реформу в герцогстве, нацеленную прежде всего на упрочнении своего положения путем проостзейской пропаганды."
 UBD_wellfare: "Социальное законодательство"
 UBD_wellfare_desc: "Несмотря на преобладание в правительстве консервативных правых взглядов на рабочий вопрос, оно все же вынуждено идти на уступки, чтобы заручится поддержкой рабочих и вырвать их из лап социалистов."
 UBD_police_organisation: "Организация полиции и контрразведки"
 UBD_police_organisation_desc: "Для выживания герцогства необходимо заменить местные отряды ополчения при ландратах на профессиональную полицию, способную противостоять сепаратистам и большевистскому подполью."
 UBD_economic_regulation: "Расширение экономического вмешательства"
 UBD_economic_regulation_desc: "Повсеместная политическая и экономическая нестабильность вынуждает правительство принять ряд мер по увеличению государственного вмешательства в экономику страны."
 UBD_trade_law: "Новое таможеное законодательство"
 UBD_trade_law_desc: "Распад России оборвал традиционные экономические связи, а устаревшие имперские законы мешают экономическому росту. Необходимо полностью переписать торговое и таможенное законодательство опираясь на опыт Германской Империи."
 UBD_german_economic_integration: "Экономическая интеграция с Германией"
 UBD_german_economic_integration_desc: "Будущее остзейских немцев неразрывно связано с Германией и правительство герцогства намерено продолжить курс на упрочнение этих связей путем дальнейшей экономической интеграции."
 UBD_forest_industry: "Лесная промышленность"
 UBD_forest_industry_desc: "Земли герцогства богаты лесом. Разумно будет инвестировать в ряд лесозаготовительных предприятий для улучшения экономической ситуации."
 UBD_russo_balt_factory: "Восстановление РБВЗ"
 UBD_russo_balt_factory_desc: "Русско-балтийский вагонный завод - одно из крупнейших машиностроительных предприятий в Российской Империи. Осенью 1915 года имущество завода по большей части было вывезено на Восток и работа на предприятии прекратилась. Правительство намерено приобрести все необходимое оборудование и нанять рабочих, чтобы восстановить завод и начать выпуск продукции."
 UBD_airplane_production: "Рижские аэропланы"
 UBD_airplane_production_desc: "Для возобновления производства гражданских и военных аэропланов на русско-балтийском заводе предприятию понадобятся дополнительные инвестиции."
 UBD_revel_dockyards: "Верфи Ревеля"
 UBD_revel_dockyards_desc: "После ухода русских войск ревельские верфи были превращены Рейхсхеером в склады. Необходимо отремонтировать их и возобновить судостроительство."
 UBD_river_fleet: "Двинская Флотилия"
 UBD_river_fleet_desc: "Командование Ландесвера намерено переоборудовать ряд гражданских пароходов для формирования Двинской речной флотилии."
 UBD_form_landwehr: "Формирование Ландесвера"
 UBD_form_landwehr_desc: "Регентский совет подготовил план по созданию лояльной вооруженной силы - Балтийского Ландвера. Уже существующие местные отряды  самообороны состоящие из остзейских немцев будут объединены в единую регулярную армейскую структуру при активном содействии германских советников."
 UBD_open_arsenals: "Рижский арсенал"
 UBD_open_arsenals_desc: "Военная промышленность страны серьезно пострадала от войны, многие заводы были разрушены, заброшены или вовсе эвакуированы в Россию. Для обеспечения ландвера боеприпасами и снижения зависимости от Германии в военной сфере правительство намерено выделить средства на восстановление арсенала в Риге."
 UBD_form_ethnic_batalions: "Национальные полки"
 UBD_form_ethnic_batalions_desc: "Имеющегося остзейского немецкого населения слишком мало чтобы обеспечить растущие вооруженные силы пополнениями. Необходимо начать рекрутский набор среди наиболее лояльных слоев эстонского и латышского населения для формирования лояльных национальных частей."
 UBD_form_rus_batalions: "Русские добровольческие части"
 UBD_form_rus_batalions_desc: "На территории герцогства остается множество бывших солдат и офицеров императорской армии настроенных против большевиков. Военное рукводство Рейха уже начало использовать этот ресурс для формирования прогерманских антибольшевистских частей. Правительство намерено создать аналогичные отряды подчиненные командованию ландвера."
 UBD_mobilise_officers: "Мобилизация офицеров"
 UBD_mobilise_officers_desc: "В частях наблюдается острая нехватка кадров среди офицерского состава. Необходимо поставить в строй каждого офицера годного к службе в армии."
 UBD_shock_regiments: "Ударные батальоны"
 UBD_shock_regiments_desc: "Опыт окопной войны показал что любой армии требуются специальные ударные части для прорыва укрепленных линий противника."
 UBD_ost_ruble: "Введение Ост рубля"
 UBD_ost_ruble_desc: "Отсутсвие собственной валюты и финансовых резервов вынуждает Совет обратиться к администрации Обер-оста с целью согласования заема на нужды правительства."
 UBD_landowners_finance: "Пожертвования землевладельцев"
 UBD_landowners_finance_desc: "Регентский совет намерен получить справедливую оплату в виде принудительного займа за свои труды на поприще защиты прав и свобод остзейских помещиков."
 UBD_start_ostpolitik: "Ост-политика"
 UBD_start_ostpolitik_desc: "Власти Германии намерены провести мероприятия по германизации прибалтийских губерний путем колонизации края немцами из Рейха и немецкими беженцами из Поволжья, Крыма и Украины. Правительство герцогства так же заинтересовано в этих мероприятиях, ведь рост числа лояльного немецкого населения упрочнит власть остзейских немцев над латышами и эстонцами."
 UBD_offer_the_land: "Добровольцы из Рейхсхеера"
 UBD_offer_the_land_desc: "Германское командование предложило план по которому военнослужащие 8-ой армии немецкого Рейхсхеера, находящейся в Герцогстве, получат земельный надел и гражданство в обмен на службу в вооруженных формированиях подчиненных правительству Герцогства. Майор Йозеф Бишов уже ведет работу по созданию таких формирований."
 UBD_six_reserve_corps: "Запрос немецких войск"
 UBD_six_reserve_corps_desc: "Для борьбы с большевистской угрозой правительство намерено обратиться к властям Германии с просьбой вмешаться в конфликт и передать в подчинение Герцогству 6-ой резервный корпус генерала Рюдигера фон дер Гольца находящийся в Пруссии."
 UBD_ostzee_army: "Остзейская Армия"
 UBD_ostzee_army_desc: "Ландесвер теперь представляет собой настоящую армию - Остзейскую Армию"
 UBD_crush_separatist_organisations: "Герцогство на века"
 UBD_crush_separatist_organisations_desc: "Пришло время положить конец сепаратистскому движению в стране."
 UBD_entente_question: "Переговоры с Антантой"
 UBD_entente_question_desc: "Хотя Великобритания и настроена против немецких протекторатов в Восточной Европе и склонна поддерживать альтернативные сепаратистские правительства латышей и эстонцев, мы все же можем убедить их поддержать нас на основании того, что успешная борьба с большевиками важнее независимости незначительных наций, а предложение о создании исключительно выгодных британских концессий в стране подстегнет и английскую жажду наживы."
 UBD_pilar_winnig_agreement: "Соглашение Пилара-Виннига"
 UBD_pilar_winnig_agreement_desc: ""
 UBD_contact_lithunia: "Контакт с литовцами"
 UBD_contact_lithunia_desc: "Литовское правительство до сих пор сохраняет в отношении нашего государства нейтралитет. Необходимо установить прочный контакт с правительством в Вильнюсе хотя бы ради безопасности южной границы."
 UBD_ally_finland: "Союз с финами"
 UBD_ally_finland_desc: "Командование финской армии в лице генерала Карла Густава Эмиля Манергейма известно своей антипатией к большевикам. Сам генерал уже предлагал русским контрреволюционерам военное сотрудничество в обмен на признание независимости Финляндии но видимо получил отказ. Возможно совместное наступление остзейской и финской армий на Петроград лучше обеспечит независимость Гельсингфорса чем слова русских дипломатов."
 UBD_help_from_scandinavia: "Помощь от скандинавов"
 UBD_help_from_scandinavia_desc: "Нам нужны винтовки и люди что будут их держать. Правительство намерено обратиться за помощью к странам Северной Европы. Возможно правительства этих стран выделят некоторую материальную помощь, а может и согласятся отправить добровольческие контингенты."
 UBD_ally_north_western_army: "Взаимодействие с северо-западниками"
 UBD_ally_north_western_army_desc: "Риге не обязательно сражаться с большевиками в одиночку. В Пскове уже образовалась русская "белая" армия антибольшевисткого толка. Наше взаимодействие с ней позволит отбросить красных от границ."
 UBD_avalov_problem: "Проблема Авалова"
 UBD_avalov_problem_desc: "Генерал Павел Рафаилович Бермондт-Авалов уже продолжительное время занимается формированием русских отрядов в районе Митавы. Формально эти части находятся в подчинении командующего русской армией в Пскове, однако известно что генерал Авалов считает свою армию равной псковской и не выполняет приказа отбыть на антибольшевистский фронт. Это порождает проблемы и для нас ведь иметь в тылу крупную армию русских контрреволюционеров опасно, а взгляды Павла Рафаиловича на независимость Балтики неизвестны. Будет лучше помочь генералу закончить формирование своей армии и спровадить их на Восток."
 UBD_petrograd_offensive: "Наступление на Восток"
 UBD_petrograd_offensive_desc: "Наши взаимоотношения с командованием Северо-Западной Армии достигли достаточного уровня для организации военного альянса направленного против большевиков."
 
