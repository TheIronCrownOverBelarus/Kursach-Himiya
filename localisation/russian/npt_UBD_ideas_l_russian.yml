l_russian:
 UBD_german_occupation_idea: "Немецкие гарнизоны"
 UBD_german_occupation_idea_desc: "Одной из многих проблем нашей страны является отсутствие собственных вооруженных сил. В данный момент их заменяет германский Рейхсхеер. Немецкие гарнизоны фактически являются реальной властью на местах и мало считаются с правительством герцогства. Эта ситуация ежедневно порождает все новые и новые конфликты и разжигает националистические настроения среди латышей и эстонцев. К тому же продовольственные проблемы в Германии вынуждают местные войска заниматься реквизицией продовольствия и материальных ценностей что наносит ущерб нашей экономике, которая и без того находится в печальном состоянии."
 UBD_financial_problem_2_idea: "Финансовые проблемы"
 UBD_financial_problem_2_idea_desc: "Казна Герцогства фактически пуста, а налоговая система только создается. Любые решения принимаемые правительством бессмыслены, если нечем финансировать их исполнение. Эта проблема должна быть решена до того как авторитет властей в глазах населения не упал до той степени, когда Совету перестанут подчинятся даже собственные секретари ввиду невыплаты им жалования."
 UBD_financial_problem_1_idea: "Финансовые затруднения"
 UBD_financial_problem_1_idea_desc: "Принятые правительством меры по улучшению финансовой ситуации оказались весьма результативными, однако хронический дефецит бюджета продолжает чинить препятствия в государственном управлении."
 UBD_knighthood_support_idea: "Балтийское рыцарство"
 UBD_russo_balt_factory_1_idea: "РБВЗ"
 UBD_russo_balt_factory_1_idea_desc: "Русско-балтийский вагоностроительный завод (РБВЗ) - крупнейшее машиностроительное предприятие герцогства, унаследованное им от империи. Специализируется на производстве вагонов и автомобилей."
 UBD_russo_balt_factory_2_idea: "РБВЗ"
 UBD_russo_balt_factory_2_idea: "Русско-балтийский вагоностроительный завод (РБВЗ) - крупнейшее машиностроительное предприятие герцогства, унаследованное им от империи. Специализируется на производстве вагонов, автомобилей и аэропланов."
 UBD_river_fleet_idea: "Двинская Флотилия"
 UBD_german_integration_idea: "Экономическая интеграция с Германией"
 UBD_ethnic_conflict_idea: "Этнические конфликты"
 UBD_ethnic_conflict_idea_desc: "Земли старой Ливонии населяют три основных народа: остзейские немцы, латыши и эстонцы. Националистические движения и земельные притязания последних представляют собой угрозу власти крупных немецких землевлевладельцев и древних рыцарских орденов, которые в свою очередь стремятся к расширению своего экономического, политического и культурного влияния в регионе. Сепаратистские движения растут день ото дня."
 UBD_landwehr_1_idea: "Балтийский ландесвер"
 UBD_landwehr_1_idea_desc: "Балтийский ландесвер - вооруженые силы Объединенного Балтийского Герцогства состоящие из остзейских немецких отрядов ополчения и национальных батальонов латышей и эстонцев согласившихся поступить на службу в Ландвер"
 UBD_landwehr_2_idea: "Остзейская Армия"
 UBD_landwehr_2_idea_desc: "Дальнейшее расширение Ландвера и улучшение его технического обеспечения позволило командованию реорганизовать отряды ополчения в полноценную регулярную армию способную на равных противостоять агрессивным соседям Герцогства."
 UBD_RUS_regiments_idea: "Белогвардейские части"
 UBD_RUS_regiments_idea_desc: "На территории герцогства находятся ряд русских добровольческих формирований, целью которых является борьба с большевизмом."
 UBD_service_for_land_idea: "Земля за службу"
 UBD_service_for_land_idea_desc: "Правительство организовало программу по которой солдаты и офицеры Рейхсхеера могут перейти на службу в Балтийский Ландвер взамен получив надел из специально созданного для этих целей земельного фонда."
 UBD_state_rebellion_dynamic_modifier: "Крестьянское сопротивление"