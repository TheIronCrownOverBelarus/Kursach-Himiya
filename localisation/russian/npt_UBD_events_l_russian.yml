 ubd.30.t: "Поражение Германии"
 ubd.30.desc: "Сегодня пришли вести с Западного фронта. Германская армия была разгромлена, а правительство Рейха заключило перемирие, одним из пунктов которого является вывод войск с восточных территорий. Для нас это означает ликвидацию всех германских военных учреждений и передачу всей полноты власти регентскому совету. Теперь последний остался один в неравной борьбе с сепаратистами и русскими. В отдаленых уголках страны уже поднимают головы банды националистов-партизан желающих свержения нашей власти и создания собственных независимых государств. На сегодняшнем заседании совета его члены должны решить будущее балтийского государства и населяющих его народов."
 ubd.30.a: "Во избежание кровопролития совет вынужден самоустраниться"
 ubd.30.b: "Попробуем достичь компромисса с умеренными националистами"
 ubd.30.c: "Любые беспорядки будут подавлены, а порядок будет восстановлен"
 ubd.31.t: "Упразднение Герцогства"
 ubd.31.desc: "Очевидная неспособность оказать сопротивление националистам признанных Антантой вынудила балтийских дворян передать власть национальному Эстонскому и Латвийскому правительствам. Последние уже начали работу по формированию собственного государственного аппарата и армии. Балтенланд, как проект государства остзейских немцев, канул в лету навсегда. Наверное..."
 ubd.31.a: "Рига далеко от фронта"
 ubd.31.b: "Таллин - красивый город"
 ubd.31.c: "Всегда хотел повидать Псковский Кремль"
 ubd.32.t: "Восстание сепаратистов"
 ubd.32.desc: "Отказ регентов сдать власть политические лидеры националистов восприняли как объявлении войны. По данным министерства иностранных дел представители Антанты в Стокгольме уже объявили о признании Эстонского и Латышского националистов правительств. Последние в свою очередь отдали населению приказ вести борьбу с "немецкими помещиками и угнетателями". Сельская местность впадает в анархию, а лояльные совету войска стягиваются в район Риги и Митавы."
 ubd.32.a: "Самая темная ночь перед рассветом"
 ubd.33.t: "Военное положение"
 ubd.33.desc: "   Приказ N.1 главнокомандующего Балтийским Ландесвером полковника Альфреда Флэтчера об объявлении на военном положении на всей территории Курляндской, Лифляндской и Эстляндской губерний:\n   "Именем Герцога Балтийского Адольфа Фридриха Мекленбург-Шверинского всю территорию Курляндии, Лифляндии и Эстляндии объявляю на военном положении с этого дня и до восстановления порядка.\n   На основании решения Регентского Совета вся городская и уездная полиция названных районов подчиняется мне.\n   Объявляя о сем, призываю всех без исключения граждан к выполнению своего гражданского патриотического долга по борьбе с бандитизмом. Родина зовет вас, граждане, на путь созидательной творческой работы, а работы такая масса, что для всех хватит дела, хватило бы только сил. Все силы граждан должны быть отданы на восстановление и созидание общей для всех Родины, и распылять эти силы в раздорах, спорах и недостойной борьбе, особенно в настоящее тяжелое время, преступно.\n   Деятели и труженики печатного слова обязаны разумно пользоваться свободой печати, умом и сердцем должны отыскать ту грань,где кончается свобода и начинается разнузданность слова.Никаким человеконенавистническим воплям, недостойным выпадам по адресу своих политических противников и истерическим выкрикам, восстанавливающих одну часть населения против другой, не должно быть места на страницах периодической печати. Пора найти достойный тон и приличный слог, никого не задевающий и никого не оскорбляющий.\n   Всяким активным выступлениям должен быть положен конец, и я с беспощадной строгостью пресеку все революционные выступления, откуда бы таковые ни исходилии каким бы способом они ни проводились, т.е. путем ли активного выступления, призывом ли на словах или печатным словом."\n                                              Штаб командующего. Рига"
 ubd.33.a: "GOTT MIT UNS!"
 ubd.34.t: "Высадка английского десанта"
 ubd.34.desc: "Воспользовавшись капитуляцией Германии и хаосом охватившим балтийские губернии английский флот под командованием контр-адмирала Эдвина Александра-Синклера провел десантную операцию на Эзеле и Даго. Разоружив местные немецкие силы они закрепились на островах и теперь угрожают Риге. Известно также что англичане передали эстонским сепаратистам вооружение из захваченных на островах складов."
 ubd.34.a: "Будь ты проклят Синклер"
