 ubd.1.t: "Власть Рейхсхеера"
 ubd.1.desc: "     Падение Риги в сентябре 1917 и последовавшая за ней немецкая наступательная операция "Фаустшлаг" поставило балтийские земли под полный контроль Рейхсвера. Для управления занятыми территориями были созданы 3 генеральных командования:\n     В Эстляндии - генеральное командование zbV 68 со штабом в Таллинне и под командованием генерал-лейтенанта Адольфа фон Зекендорфа.\n     В северной части Видземской губернии - генеральное командование zbV60 со штабом в Тарту и под командованием генерал-лейтенанта Людвига фон Эсторфа, заместителя командующего 8-ой армии.\n     В южной части Видземской губернии - генеральное командование zbV 67 со штаб в Двинске и под командованием генерал-лейтенанта Рейнхарда фон Шеффера Бойяделя.\n     Перед военной администрацией лежит тяжелая задача по поддержанию порядка на разрываемых национальными конфликтами землях, которая осложняется необходимостью вывоза разного рода ресурсов и ценностей в Берлин для поддержания немецкой экономики. Перед командующим оккупационными войсками генералом Хуго Карлом Готлибом фон Катеном также стоит задача содействовать государственному строительству местных остзейских немцев, довольно лояльно относящихся к германским властям, пока что..."
 ubd.1.a: "Долгие лета генералу Катену!"
 ubd.2.t: "Созыв Ландрата"
 ubd.2.desc: "     Для разрешения вопроса о судьбе занимаемых Германией балтийских территорий сегодня в Риге был созван Объединенный Ландрат Лифляндии, Эстляндии, Эзеля и Риги. В его состав вошли 35 остзейских немцев , 13 эстонцев и 10 латышей. Председателем совета был избран барон Эдуард Юлиус Александр Фрейхерр фон Деллингсхаузен. Объединенный земельный совет принял решение:\n     1 - Обратиться к Германскому Императору с просьбой продолжать защищать балтийские губернии и содействовать их окончательному отделению от России.\n     2 - Выразить пожелание о создании конституционной монархии с самоуправлением в Видземе, Курляндии, Эстляндии, Риге и на островах Эзель и Даго, присоединенной к Государству Германскому посредством личной унии с Королем Пруссии, и просить Германского Императора милостиво принять это пожелание балтийских народов и исполнить его.\n     3 - Просить у Германского Императора о выделении средств на создание собственных земельных институтов для Лифляндии и Эстляндии, которые будут руководить управлением Лифляндии и Эстляндии до окончательного объединения балтийских земель.\n     4 - Просить о том чтобы между Германским Государством и Пруссией были заключены необходимые военные, монетные, торговые, таможенные, мерные, весовые и другие соглашения, а также соглашение о создании государства на балтийских землях."
 ubd.2.a: "Что скажет Кайзер?"
 ubd.3.t: "Регентский Совет"
 ubd.3.desc: "     Сегодня Объединенный земельный совет Лифляндии, Эстляндии, Эзеля и Риги издал распоряжение о создании Балтийского регентского совета и Балтийского земельного комитета с функциями правительства.\n     В состав регентского совета вошли:\n10 постоянных членов: В. фон Бюльмеринк , А. фон Хан , Э. Хепнер, А. Красткалнс , Й. Блаус, Й. Бисениекс , Г. Йирманис, Л. Саар-Кир, П. Тараска и председатель совета.\n     Также в заседаниях совета будут учавствовать трое представителей меньшинств: Й. Пургалис (латыш), Г. Нурмс (эстонец), Ф. Самсон фон Химмельшерн (литовец).\n     Земельный комитет будет составлен из 60 членов под руководством Эдуарда Юлиуса Александра Фрейхерра фон Деллингсгаузена, в том числе и 10 членов Регентского совета. \n     Однако председатель регентского совета все еще не избран и насчет его кандидатуры ведутся жаркие споры. Большая часть дворян-помещиков поддерживают консервативного Адольфа Пилара фон Пильхау, интеллигенция и сторонники компромисса с латышами и эстонцами выступают за то чтобы Деллингсгаузен возглавил оба органа. Промышленники, гильдии и умеренные дворяне поддерживают своего кандидата - Реймерса.\n     В итоге решающий голос был отдан за..."
 ubd.3.a: "Опытного Пильхау-Аудерна"
 ubd.3.b: "Прогрессивного Деллингсгаузена"
 ubd.3.f: "Умеренного Реймерса"
