 ubd.1.t: "Власть Рейхсхеера"
 ubd.1.desc: "     Падение Риги в сентябре 1917 и последовавшая за ней немецкая наступательная операция "Фаустшлаг" поставило балтийские земли под полный контроль Германии. Для контроля за территорией были созданы 3 генеральных командования:\n     В Эстляндии - генеральное командование zbV 68 со штабом в Таллинне и под командованием генерал-лейтенанта Адольфа фон Зекендорфа.\n     В северной части Видземской губернии - генеральное командование zbV60 со штабом в Тарту и под командованием генерал-лейтенанта Людвига фон Эсторфа, заместителя командующего 8-ой армии.\n     В южной части Видземской губернии - генеральное командование zbV 67 со штаб в Двинске и под командованием генерал-лейтенанта Рейнхарда фон Шеффера Бойяделя.\n      Генерал Хуго Карл Готлиб фон Катен, командующий Рейхсхеером в регионе, намерен создать полноценную военную администрацию, территориально разделенную на кантоны: "Эстляндия", "Эзель", "Северная Ливония", "Южная Ливония", "Рига", "Курляндия" и "Латгалия"."
 ubd.1.a: "Долгие лета генералу Катену!"
 ubd.2.t: "Созыв Ландрата"
 ubd.2.desc: "     Для разрешения вопроса о судьбе занимаемых Германией балтийских территорий сегодня в Риге был созван Объединенный Ландрат Лифляндии, Эстляндии, Эзеля и Риги. В его состав вошли 35 остзейских немцев , 13 эстонцев и 10 латышей. Председателем совета был избран барон Эдуард Юлиус Александр Фрейхерр фон Деллингсхаузен. Объединенный земельный совет принял решение:\n     1 - Обратиться к Германскому Императору с просьбой продолжать защищать балтийские губернии и содействовать их окончательному отделению от России.\n     2 - Выразить пожелание о создании конституционной монархии с самоуправлением в Видземе, Курляндии, Эстляндии, Риге и на островах Эзель и Даго, присоединенной к Государству Германскому посредством личной унии с Королем Пруссии, и просить Германского Императора милостиво принять это пожелание балтийских народов и исполнить его.\n     3 - Просить у Германского Императора о выделении средств на создание собственных земельных институтов для Лифляндии и Эстляндии, которые будут руководить управлением Лифляндии и Эстляндии до окончательного объединения балтийских земель.\n     4 - Просить о том чтобы между Германским Государством и Пруссией были заключены необходимые военные, монетные, торговые, таможенные, мерные, весовые и другие соглашения, а также соглашение о создании государства на балтийских землях."
 ubd.2.a: "Что скажет Кайзер?"
 ubd.3.t: "Делегация из Риги"
 ubd.3.desc: "В Берлин прибыла делегация от Балтийского Ландтага в Риге с целью получить признание Германией их независимости и одобрение создания в Прибалтике конституционной монархии объединенной личной унией с Пруссией. Они также желают чтобы их территории были включены в состав Германской Империи, а германская армия продолжила защищать их от русских.n\Конечно это признание просто невозможно ведь по мирному договору Россия отказывалась от своих прав лишь на Курляндию, а не на всю Ливонию. Однако мы могли бы навязать русским дополнительное соглашение."
 ubd.3.a: "Это займет некоторое время"
 ubd.4.t: "Ответ Кайзера"
 ubd.4.desc: "Германский император заявил что пожелания Объединенного Земельного Совета пока не могут быть удовлетворены ввиду остающихся за русскими прав на Прибалтику. Однако германское правительство заверило нас что приложит все дипломатические усилия для того чтобы юридически отделить Эстляндию и Ливонию от России."
 ubd.4.a: "Остается только ждать"
 ubd.5.t: "Предложение Хинце"
 ubd.5.desc: "Государственный секретарь Министерства иностранных дел Германской Империи контр-адмирал Пауль фон Хинце предлагает нам подписать германо-российское дополнительное соглашение о демаркации российской границы и создании транспортных коридоров между двумя странами. Германия обязывается не поддерживать силы, враждебные Советской России. Также предлагается подписать германо-российское финансовое соглашение и частноправовое соглашение."
 ubd.5.a: "Интересно"
 ubd.6.t: "Доплнительный протокол к Брест-Литовскому мирному договору\nЧасть 1"
 ubd.6.desc: "1. На всех фронтах, где встречаются немецкие и российские войска, незамедлительно будут созданы российско-германские пограничные комиссии. Детали будут определены командующими соответствующими армиями. Между фронтами будут установлены нейтральные зоны путем создания транспортных коридоров.\n2. В соответствии с Брест-Литовским договором, Российско-германская комиссия по демаркации границы должна более точно определить восточную границу Эстонии и Ливонии. Только после того, как эта граница будет установлена, Германия немедленно освободит территорию к востоку от этой границы.\n3. Германия выведет свои войска с территории к востоку от Березины еще до заключения всеобщего мира, если Россия выплатит сумму денег, предусмотренную настоящим договором. Немецкие войска покинут территорию к западу от Березины только в том случае, если Россия выполнит все свои финансовые обязательства.\n4. Если иное не предусмотрено Брест-Литовским договором или настоящим Дополнительным договором, Германия не будет каким-либо образом вмешиваться в отношения между Российским государством и частью его территории и, следовательно, не будет создавать и не будет поддерживать образование независимых государств на этих территориях.\n5. Россия сделает все возможное, чтобы вытеснить войска союзников с территории Северной России, сохраняя при этом нейтралитет. Германия гарантирует, что в ходе этих операций финские войска не будут вторгаться на российскую территорию, особенно в Петроград.\n6. После вытеснения союзных войск с территории Северной России вдоль северного побережья будет установлена трехмильная зона судоходства, однако рыболовным судам будет разрешено плавать в пределах зоны в 30 миль.\n7. Россия, принимая во внимание нынешнюю ситуацию в Эстонии и Ливонии, отказывается от суверенных прав на эти регионы, а также от любого вмешательства в их внутренние дела. Их дальнейшая судьба будет определяться их жителями. Эстония и Ливония не несут перед Россией никаких обязательств, вытекающих из их прежнего союза с Россией.\n8. В целях содействия российской торговле через Эстонию, Ливонию, Курляндию и Литву постановляется: 1. В Эстонии, Ливонии, Курляндии и Литве перевозка товаров из России и в Россию должна быть абсолютно свободной, без каких-либо транспортных пошлин. 2. Железнодорожные тарифы из России до станций Таллинн , Рига и Вентспилс должны быть минимальными. 3. Судоходство по реке Даугава из России в открытое море, а также между всеми портами Ливонии-Курляндии на Даугаве и портами России должно быть свободным, без дискриминации судов или субъектов любой из сторон. Это также относится к деревянным плотам. 4. В портах Таллинна , Риги и Вентспилса должны быть созданы российские зоны свободных портов , где хранятся и упаковываются российские импортные или экспортные товары, а таможенное оформление товаров может осуществляться российскими должностными лицами. 5. В связи с войной или санитарной обстановкой указанные выше пункты могут быть изменены по специальному соглашению."
 ubd.6.a: "Как много букв"
 ubd.7.t: "Доплнительный протокол к Брест-Литовскому мирному договору\nЧасть 2"
 ubd.7.desc: "9. Уровень воды в озере Чудском не должен изменяться искусственно. Электроэнергия, вырабатываемая Нарвской гидроэлектростанцией, должна поставляться в Петроградскую губернию на основании специального соглашения.\n10. В соглашениях между Эстонией, Ливонией, Курляндией и Литвой, с одной стороны, и Россией, с другой, должны быть предусмотрены следующие пункты: 1. О праве представителей всех национальностей выбирать и покидать; 2. О возвращении имущества граждан и общественных организаций этих территорий из России, а также о возвращении в Россию имущества российских граждан, проживающих на этих территориях; 3. О имуществе коммунальных объединений, расположенных по обе стороны новых границ; 4. Об архивах, правовых и административных документах, записях о рождении, браке, смерти и т.д.; 5. О регулировании новых границ; 6. О влиянии территориальных изменений на межгосударственные соглашения.\n11. После ратификации российско-украинского мирного договора Германия выведет войска с территории России на Черном море, за исключением Кавказа.\n12. Германия должна вывести свои войска с территорий, не упомянутых в решении 3-го Всеукраинского съезда от 7 ноября 1917 года, до заключения всеобщего мира. С территории к востоку от Ростовско - Воронежской железной дороги и города Ростова Германия выведет свои войска по запросу России. Германия будет поставлять России уголь из оккупированного Донецкого бассейна в обмен на нефть из Бакинской области.\n13. Россия согласна с решением Германии признать Грузию независимым государством.\n14. Германия не будет поддерживать военные операции третьих стран на Кавказе за пределами Грузии.\n15. Германия признает военные корабли Российской империи, захваченные на Украине и в Финляндии , российской собственностью, которая останется под немецким надзором до заключения всеобщего мира.\n16. Германия признает требования России о компенсации за конфискованные российские склады за пределами Украины и Финляндии.\n17. Настоящее Дополнительное соглашение должно быть ратифицировано, а подписанные документы обменены в Берлине не позднее 6 сентября 1918 года. Соглашение вступает в силу с момента обмена ратификационными грамотами."
 ubd.7.a: "Сообщите Хинце что СНК согласен"
 ubd.8.t: "СНК согласен"
