 ubd.30.t: "Поражение Германии"
 ubd.30.desc: "Сегодня пришли вести с Западного фронта. Германская армия была разгромлена, а правительство рейха заключило перемирие одним из пунктов которого является вывод войск с восточной территории. Это означает ликвидацию всех германских военных учреждений и передачу полной власти Регентскому совету. Теперь последний остался один в неравной борьбе с сепаратистами и русскими. В отдаленых уголках страны уже поднимают головы банды националистов партизан желающих свержения нашей власти и создания собственных независимых государств. На сегодняшнем заседании совета его члены должны решить будущее балтийского государства и населяющих его народов."
 ubd.30.a: "Во избежание кровопролития совет вынужден самоустраниться"
 ubd.30.b: "Мы предложим националистам компромиссный вариант"
 ubd.30.c: "Любые беспорядки будут подавлены, а порядок будет восстановлен"
 ubd.31.t: "Упразднение Герцогства"
 ubd.31.desc: "Очевидная неспособность оказать сопротивление националистам поддерживаемым Антантой вынудила балтийских дворян передать власть национальному Эстонскому и Латвийскому правительствам. Последние уже начали работу по формированию собственного государственного аппарата и армии. Балтенланд, как проект государства остзейских немцев, канул в лету навсегда. Наверное..."
 ubd.31.a: "Рига далеко от фронта"
 ubd.31.b: "Таллин - красивый город"
 ubd.31.c: "Всегда хотел повидать Псковский Кремль"
 ubd.32.t: "Образование Балтийской Конфедерации"
 ubd.32.desc: ""
 ubd.32.a: "Пожалуй наилучший исход"
 ubd.33.t: "Восстание сепаратистов"
 ubd.33.desc: ""
 ubd.33.a: "Мобилизация!"
 ubd.34.t: "Военное положение"
 ubd.34.desc: "   Приказ N.1 главнокомандующего Балтийским Ландесвером полковника Альфреда Флэтчера об объявлении на военном положении на всей территории Курляндской, Лифляндской и Эстляндской губерний:\n   "Именем Герцога Балтийского Адольфа Фридриха Мекленбург-Шверинского всю территорию Курляндии, Лифляндии и Эстляндии объявляю на военном положении с этого дня и до восстановления порядка.\n   На основании решения Регентского Совета вся городская и уездная полиция названных районов подчиняется мне.\n   Объявляя о сем, призываю всех без исключения граждан к выполнению своего гражданского патриотического долга по борьбе с бандитизмом. Родина зовет вас, граждане, на путь созидательной творческой работы, а работы такая масса, что для всех хватит дела, хватило бы только сил. Все силы граждан должны быть отданы на восстановление и созидание общей для всех Родины, и распылять эти силы в раздорах, спорах и недостойной борьбе, особенно в настоящее тяжелое время, преступно.\n   Деятели и труженики печатного слова обязаны разумно пользоваться свободой печати, умом и сердцем должны отыскать ту грань,где кончается свобода и начинается разнузданность слова.Никаким человеконенавистническим воплям, недостойным выпадам по адресу своих политических противников и истерическим выкрикам, восстанавливающих одну часть населения против другой, не должно быть места на страницах периодической печати. Пора найти достойный тон и приличный слог, никого не задевающий и никого не оскорбляющий.\n   Всяким активным выступлениям должен быть положен конец, и я с беспощадной строгостью пресеку все революционные выступления, откуда бы таковые ни исходилии каким бы способом они ни проводились, т.е. путем ли активного выступления, призывом ли на словах или печатным словом."\n                                              Штаб командующего. Рига"
 ubd.34.a: "Умрем за Балтенланд!"
