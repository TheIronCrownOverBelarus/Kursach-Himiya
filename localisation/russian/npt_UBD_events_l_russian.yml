 ubd.2.t: "Созыв Ландрата"
 ubd.2.desc: "Для разрешения вопроса о судьбе занимаемых Германией балтийских территорий сегодня в Риге был созван Объединенный Ландрат Ливонии, Эстляндии, Эзеля и Риги. В его состав вошли 35 остзейских немцев , 13 эстонцев и 10 латышей. Председателем совета был избран барон Эдуард Юлиус Александр Фрейхерр фон ДеллингсхаузенСовет Объединенных Видземских, Эстонских, Рижских и Саамских островов принимает решение:Обращение к германскому императору с просьбой продолжать оказывать военную защиту Видземе и Эстонии и успешно содействовать их окончательному отделению от России.Выразить пожелание о создании монархически-конституционного государства с единой конституцией и самоуправлением из Видземе, Эстонии, островов у Курляндии и города Риги, который присоединен к Германскому государству посредством личной унии с королем Пруссии, и попросить Германского императора милостиво принять это пожелание балтийских народов и исполнить его.Спросите у германского императора:1) что он выделит средства на создание собственных земельных институтов для Видземе и Эстонии, которые будут руководить управлением Видземе и Эстонией до окончательного объединения Прибалтики.2) чтобы между немецким государством и Пруссией были заключены необходимые военные, монетные, торговые, таможенные, мерные, весовые и другие соглашения, а также соглашение о создании государства в Прибалтике."
