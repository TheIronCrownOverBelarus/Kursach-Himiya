 ubd.9.a: "Да здравствует контр-адмирал фон Хинце!"
 ubd.10.t: "Образование временного правительства"
 ubd.10.desc: "     Сегодня Объединенный земельный совет Лифляндии, Эстляндии, Эзеля и Риги издал распоряжение о создании Балтийского регентского совета и Балтийского земельного комитета с функциями правительства.\n     В состав регентского совета вошли:\n10 постоянных членов: В. фон Бюльмеринк , А. фон Хан , Э. Хепнер, А. Красткалнс , Й. Блаус, Й. Бисениекс , Г. Йирманис, Л. Саар-Кир, П. Тараска и председатель совета.\n     Также в заседаниях совета будут учавствовать трое представителей меньшинств: Й. Пургалис (латыш), Г. Нурмс (эстонец), Ф. Самсон фон Химмельшерн (литовец).\n     Земельный комитет будет составлен из 60 членов под руководством Эдуарда Юлиуса Александра Фрейхерра фон Деллингсгаузена, в том числе и 10 членов Регентского совета. \n     Однако председатель регентского совета все еще не избран и насчет его кандидатуры ведутся жаркие споры. Большая часть дворян-помещиков поддерживают консервативного Адольфа Пилара фон Пильхау, интеллигенция и сторонники компромисса с латышами и эстонцами выступают за то чтобы Деллингсгаузен возглавил оба органа. Промышленники, гильдии и умеренные дворяне поддерживают своего кандидата - Реймерса.\n     В итоге решающий голос был отдан за..."
 ubd.10.a: "Опытного Пильхау-Аудерна"
 ubd.10.b: "Прогрессивного Деллингсгаузена"
 ubd.10.c: "Умеренного Реймерса"
 ubd.11.t: "Балтийская Конституция"
 ubd.11.desc: "Члены Регентского совета и Земельного комитета уже продолжительное время ведут работу над проектом конституции для Балтенланда. На совместном заседании двух органов большинством голосов был принят проект..."
 ubd.11.a: "Унитарной конституционной монархии"
 ubd.11.b: "Федеративной конституционной монархии"
 ubd.11.c: "Федеративной парламентской республики"
