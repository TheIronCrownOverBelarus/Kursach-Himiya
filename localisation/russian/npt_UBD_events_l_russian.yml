 ubd.100.t: "Предложение из Риги"
 ubd.100.desc: "Командующий нашим флотом в Балтийском Море контр-адмирал Эдвин Александер-Синклер получил от руководства молодого остзейского государства предложение о сотрудничестве между нашими странами. Остзейцы просят нас признать их законными правителями балтики и материально поддержать их армию - Ландесвер. Взамен они предлагают нам свои штыки в антибольшевистской борьбе, а так же различные концессии в Курляндии и Ливонии. Контр-адмирал заявил представителям остзейского государства что не имеет полномочий для принятия решений по таким вопросам, однако пообещал передать ответ Лондона."
 ubd.100.a: "Мы не станем поддерживать немецкий режим"
 ubd.100.b: "Концессии говорите?"
 ubd.101.t: "Ответ Лондона"
 ubd.101.desc: "Правительство Соединенного Королевства согласилось на наше предложение о сотрудничестве и официально заявило о дипломатическом признании нашего государства. Оно так же пообещало предоставить нам все необходимые материальные средства для борьбы с красной угрозой."
 ubd.101.a: "Наконец-то хорошие новости"
 ubd.102.t: "Ответ Лондона"
 ubd.102.desc: "Правительство Соединенного Королевство отказалось сотрудничать с нами. В Лондоне заявили что Британия признаёт только законные национальные правительства Латвийской и Эстонской Республик и намерена противостоять любым проявлениям германского империализма."
 ubd.102.a: "Придется искать помощи в другом месте"\
 ubd.103.t: "Остзейская дипломатия"
 ubd.103.desc: "Сегодня в здание министерства иностранных дел прибыла делегация Балтийского государства. Остзейские дипломаты выразили желание рижского правительства упрочнить свои отношения с нами и предложили нам дружбу и сотрудничество." 
 ubd.103.a: "Мы не ведем переговоров с германскими марионетками"
 ubd.103.b: "Взаимного признания будет достаточно"
 ubd.103.c: "Как насчет соглашения о военном сотрудничестве?"
 ubd.104.t: "Призыв о помощи"
 ubd.104.desc: "Представители остзейского государства просят нас о помощи в борьбе с большевизмом."
 ubd.104.a: "Нас это не интересует"
 ubd.104.b: "Отправьте снаряжение"
 ubd.104.c: "Отправьте добровольцев и снаряжение"